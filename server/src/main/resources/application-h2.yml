# 本地无 MySQL 时的验证 profile：java -jar target/talent-radar-server-0.1.0.jar --spring.profiles.active=h2
# 这是内存库，进程退出后数据即丢失；默认（不指定 profile）始终使用 application.yml 的 MySQL 配置。
spring:
  datasource:
    url: jdbc:h2:mem:talentradar;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: localhost
    port: 2525

talent-radar:
  mail:
    enabled: false
  crawl:
    mode: demo
