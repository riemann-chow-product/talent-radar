# 集成测试用 H2（MySQL 兼容模式），无需本机安装 MySQL
spring:
  datasource:
    url: jdbc:h2:mem:talentradar;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 2525
talent-radar:
  mail:
    enabled: false
  crawl:
    mode: demo
