<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="才探 TalentRadar 雷达图标">
  <defs>
    <linearGradient id="ctBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="ctSweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A5F3FC" stop-opacity=".05"/>
      <stop offset="1" stop-color="#A5F3FC" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#ctBg)"/>
  <!-- 扫描光束 -->
  <path d="M32 32 L52 12 A28 28 0 0 0 32 4 Z" fill="url(#ctSweep)"/>
  <!-- 雷达同心圆 -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#FFFFFF" stroke-opacity=".58" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="6.5" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="1.8"/>
  <!-- 扫描指针 -->
  <path d="M32 32 L50.5 13.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3.2" fill="#FFFFFF"/>
  <!-- 命中的人才信号点 -->
  <circle cx="46.5" cy="23" r="2.8" fill="#A5F3FC"/>
  <circle cx="19.5" cy="41" r="2.2" fill="#A5F3FC" opacity=".85"/>
  <circle cx="40" cy="46" r="1.7" fill="#FFFFFF" opacity=".7"/>
</svg>
